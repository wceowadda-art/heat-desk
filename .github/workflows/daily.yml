name: daily heat

on:
  schedule:
    - cron: "40 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: pip install pykrx pandas requests lxml html5lib beautifulsoup4

      - name: fetch and score
        working-directory: scripts
        run: |
          python fetch.py
          python score.py

      - name: copy result
        run: cp scripts/heat_kr.json public/heat_kr.json

      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/heat_kr.json
          git diff --staged --quiet || git commit -m "update heat data"
          git push
